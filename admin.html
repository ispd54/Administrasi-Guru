<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin Website - SD Negeri 3 Keramas</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<style>
:root{--bg:#f1f5f9;--card:#fff;--ink:#0f172a;--mut:#64748b;--line:#e2e8f0;--pri:#1e3a8a;--acc:#d97706;--bad:#b91c1c;--ok:#047857}
@media(prefers-color-scheme:dark){:root{--bg:#0b1220;--card:#162032;--ink:#e5e7eb;--mut:#94a3b8;--line:#2a3a52;--pri:#60a5fa;--acc:#f59e0b;--bad:#f87171;--ok:#34d399}}
*{box-sizing:border-box}body{margin:0;font:14px/1.5 system-ui,Segoe UI,sans-serif;background:var(--bg);color:var(--ink)}
.bar{background:var(--card);border-bottom:1px solid var(--line);padding:12px 20px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.wrap{max-width:960px;margin:0 auto;padding:16px}.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 14px}
button,.b{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:8px 14px;border-radius:10px;text-decoration:none;display:inline-block}
button.on,.pri{background:var(--pri);color:#fff;border-color:var(--pri)}@media(prefers-color-scheme:dark){button.on,.pri{color:#0b1220}}
.acc{background:var(--acc);color:#fff;border-color:var(--acc)}.del{color:var(--bad)}
label{display:block;margin-bottom:12px;font-weight:600}label small{font-weight:400;color:var(--mut)}
input,select,textarea{width:100%;font:inherit;padding:9px 11px;margin-top:4px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink)}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:top}th{color:var(--mut);font-weight:600}
.row{display:flex;gap:8px;align-items:center}.row input{margin:0}.mut{color:var(--mut)}.end{text-align:right}
.ov{position:fixed;inset:0;background:#0009;display:flex;align-items:center;justify-content:center;padding:14px;z-index:9}.ov .card{width:100%;max-width:560px;max-height:90vh;overflow:auto}
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ok);color:#fff;padding:10px 18px;border-radius:10px;display:none;z-index:99}#toast.bad{background:var(--bad)}
.login{max-width:380px;margin:10vh auto}img.pv{max-height:90px;border-radius:8px;margin-top:6px}
</style>
</head>
<body>
<div id="toast"></div><div id="app"></div>
<script>
const sb=supabase.createClient('https://pysptebwcnwgnzknbvld.supabase.co','eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InB5c3B0ZWJ3Y253Z256a25idmxkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTM0OTYzNzAsImV4cCI6MjEwOTA3MjM3MH0.du33KaN-dqFDxjzmtgS80H5uZlN0tm-2tTT1mmn2eSE');
const $=s=>document.querySelector(s),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const today=()=>new Date().toLocaleDateString('sv'),dId=u=>((u||'').match(/(?:\/d\/|[?&]id=)([\w-]{15,})/)||[])[1];
function toast(m,bad){const t=$('#toast');t.textContent=m;t.className=bad?'bad':'';t.style.display='block';setTimeout(()=>t.style.display='none',2800)}
const thumb=(u,w=1200)=>{const i=dId(u);return i?`https://drive.google.com/thumbnail?id=${i}&sz=w${w}`:u};

// ===== Definisi data =====
const FORMS={
 pengumuman:{t:'web_pengumuman',n:'Pengumuman',ord:'tanggal',f:[['judul','Judul'],['kategori','Kategori','sel',['Penting','Akademik','SPMB','Umum']],['tanggal','Tanggal','date'],['isi','Isi Pengumuman','area'],['berkas_url','Link lampiran Google Drive (opsional)','drv'],['berkas_nama','Nama lampiran, mis. Jadwal SPMB.pdf (opsional)']]},
 galeri:{t:'web_galeri',n:'Galeri',ord:'created_at',f:[['judul','Judul'],['kategori','Kategori','sel',['Fasilitas','Kegiatan','Prestasi']],['tipe','Jenis','sel',['foto','video']],['drive','Link Google Drive foto/video (Bagikan > Siapa saja yang memiliki link)','drv']]}
};
const TABS=[['pengumuman','📢 Pengumuman'],['sambutan','👤 Sambutan Kepala Sekolah'],['visimisi','🎯 Visi & Misi'],['jadwal','📅 Jadwal SPMB'],['galeri','🖼️ Galeri']];
let TAB='pengumuman',ROWS=[],ME=null;

// ===== Login =====
function loginView(){$('#app').innerHTML=`<form class="card login" onsubmit="login(event)"><h2>🔐 Admin Website</h2><p class="mut">SD Negeri 3 Keramas</p><label>Email<input name="email" type="email" required autocomplete="username"></label><label>Password<input name="password" type="password" required autocomplete="current-password"></label><button class="pri" style="width:100%">Masuk</button><p><a href="index.html" class="mut">← Kembali ke website</a></p></form>`}
async function login(e){e.preventDefault();const f=new FormData(e.target);
 const{data,error}=await sb.auth.signInWithPassword({email:f.get('email').trim(),password:f.get('password')});
 if(error)return toast('Gagal login: '+error.message,1);await enter(data.user)}
async function enter(u){
 const{data:p,error}=await sb.from('profiles').select('*').eq('id',u.id).maybeSingle();
 if(error||!p||p.role!=='webadmin'){await sb.auth.signOut();loginView();return toast('Akun ini bukan Admin Website.',1)}
 ME=p;shell()}
async function out(){await sb.auth.signOut();loginView()}
function shell(){$('#app').innerHTML=`<div class="bar"><b>🌐 Admin Website SDN 3 Keramas</b><span class="row"><a class="b" href="index.html" target="_blank">↗ Lihat Website</a><button onclick="out()">Keluar</button></span></div><div class="wrap"><div class="tabs">${TABS.map(([k,l])=>`<button data-k="${k}" onclick="go('${k}')">${l}</button>`).join('')}</div><div class="card" id="main"></div></div>`;go(TAB)}
function go(k){TAB=k;document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('on',b.dataset.k===k));
 ({sambutan:()=>cfgForm(['kepala','kepala_foto','sambutan']),visimisi:()=>cfgForm(['visi','misi']),jadwal:jadwal}[k]||(()=>list(k)))()}

// ===== CRUD (pengumuman, galeri) =====
async function list(k){const m=FORMS[k];$('#main').innerHTML='Memuat…';
 const{data,error}=await sb.from(m.t).select('*').order(m.ord,{ascending:false});if(error)return $('#main').innerHTML='⚠️ '+esc(error.message);ROWS=data;
 $('#main').innerHTML=`<div class="row" style="justify-content:space-between;margin-bottom:10px"><h3 style="margin:0">${m.n}</h3><button class="acc" onclick="form()">➕ Tambah</button></div><div style="overflow:auto"><table><thead><tr><th>Judul</th><th>Kategori</th><th>Tanggal</th><th></th></tr></thead><tbody>${data.map(r=>`<tr><td>${esc(r.judul)}${r.tipe==='video'?' 🎬':''}</td><td>${esc(r.kategori)}</td><td>${esc((r.tanggal||r.created_at||'').slice(0,10))}</td><td class="end"><button onclick="form('${r.id}')">✏️</button> <button class="del" onclick="del('${r.id}')">🗑️</button></td></tr>`).join('')||'<tr><td colspan="4" class="mut">Belum ada data</td></tr>'}</tbody></table></div>`}
function fld([k,l,t,o],val){val=val??'';
 if(t==='area')return `<label>${l}<textarea name="${k}" rows="5">${esc(val)}</textarea></label>`;
 if(t==='sel')return `<label>${l}<select name="${k}">${o.map(x=>`<option ${x===val?'selected':''}>${x}</option>`).join('')}</select></label>`;
 return `<label>${l}<input name="${k}" type="${t==='date'?'date':t==='drv'?'url':'text'}" value="${esc(val)}" ${k==='judul'?'required':''} ${t==='drv'?'placeholder="https://drive.google.com/file/d/.../view"':''}></label>`}
function form(id){const m=FORMS[TAB],r=id?{...ROWS.find(x=>x.id===id)}:{tanggal:today()};if(TAB==='galeri')r.drive=r.video_url||r.gambar||'';
 const o=document.createElement('div');o.className='ov';o.id='ov';o.innerHTML=`<form class="card" data-id="${id||''}" onsubmit="save(event)"><h3>${id?'✏️ Ubah':'➕ Tambah'} ${m.n}</h3>${m.f.map(f=>fld(f,r[f[0]])).join('')}<div class="end"><button type="button" onclick="$('#ov').remove()">Batal</button> <button class="pri">💾 Simpan</button></div></form>`;document.body.appendChild(o)}
async function save(e){e.preventDefault();const m=FORMS[TAB],fd=new FormData(e.target),id=e.target.dataset.id,o={};
 m.f.forEach(([k])=>o[k]=(fd.get(k)||'').trim()||null);
 if(TAB==='galeri'){const i=dId(o.drive);if(!i)return toast('Link Google Drive tidak valid',1);
  o.gambar=thumb(o.drive,1600);o.video_url=o.tipe==='video'?`https://drive.google.com/file/d/${i}/preview`:null;delete o.drive}
 if(TAB==='pengumuman'&&o.berkas_url){const i=dId(o.berkas_url);if(!i)return toast('Link lampiran harus dari Google Drive',1);o.berkas_url=`https://drive.google.com/file/d/${i}/view`}
 if(!o.tanggal&&m.f.some(f=>f[0]==='tanggal'))o.tanggal=today();
 const{error}=id?await sb.from(m.t).update(o).eq('id',id):await sb.from(m.t).insert(o);
 if(error)return toast(error.message,1);$('#ov').remove();toast('Tersimpan ✨');list(TAB)}
async function del(id){if(!confirm('Hapus data ini?'))return;const{error}=await sb.from(FORMS[TAB].t).delete().eq('id',id);
 if(error)return toast(error.message,1);toast('Data dihapus');list(TAB)}

// ===== Config (sambutan, visi misi, jadwal) =====
const CF={kepala:['Nama Kepala Sekolah'],kepala_foto:['Foto Kepala Sekolah (link Google Drive)','img'],sambutan:['Sambutan Kepala Sekolah','area'],visi:['Visi Sekolah','area'],misi:['Misi (satu baris = satu poin)','area'],spmb_badge:['Label SPMB di bar atas (mis. SPMB 2026/2027 DIBUKA)'],spmb_info:['Keterangan SPMB','area'],tahun_ajaran:['Tahun Ajaran (mis. 2026/2027)']};
async function getCfg(){const{data,error}=await sb.from('web_config').select('*');if(error)throw error;return Object.fromEntries(data.map(r=>[r.k,r.v]))}
async function putCfg(o){const{error}=await sb.from('web_config').upsert(Object.entries(o).map(([k,v])=>({k,v})),{onConflict:'k'});toast(error?error.message:'Tersimpan ✨',!!error)}
async function cfgForm(keys){$('#main').innerHTML='Memuat…';let C;try{C=await getCfg()}catch(e){return $('#main').innerHTML='⚠️ '+esc(e.message)}
 $('#main').innerHTML=`<form onsubmit="saveCfg(event,${esc(JSON.stringify(keys))})">${keys.map(k=>{const[l,t]=CF[k];return t==='img'?`<label>${l}<input name="${k}" type="url" value="${esc(C[k])}" placeholder="https://drive.google.com/file/d/.../view">${C[k]?`<img class="pv" src="${esc(C[k])}" referrerpolicy="no-referrer" alt="">`:''}<small>Foto harus dibagikan "Siapa saja yang memiliki link".</small></label>`:fld([k,l,t],C[k])}).join('')}<div class="end"><button class="pri">💾 Simpan</button></div></form>`}
async function saveCfg(e,keys){e.preventDefault();const fd=new FormData(e.target),o={};keys.forEach(k=>{let v=(fd.get(k)||'').trim();if(CF[k][1]==='img'&&v){if(!dId(v)&&!/^https:\/\//.test(v))return;v=thumb(v,800)}o[k]=v});await putCfg(o);cfgForm(keys)}

// Jadwal SPMB: disimpan sebagai teks "Kegiatan|Tanggal" per baris (config spmb_jadwal)
async function jadwal(){$('#main').innerHTML='Memuat…';let C;try{C=await getCfg()}catch(e){return $('#main').innerHTML='⚠️ '+esc(e.message)}
 const rows=(C.spmb_jadwal||'').split('\n').filter(x=>x.trim()).map(x=>x.split('|'));
 $('#main').innerHTML=`<form onsubmit="saveJ(event)"><h3 style="margin-top:0">Jadwal SPMB</h3><div id="jr">${rows.map(r=>jrow(r[0],r[1])).join('')}</div><p><button type="button" onclick="$('#jr').insertAdjacentHTML('beforeend',jrow('',''))">➕ Tambah baris</button></p><hr style="border:0;border-top:1px solid var(--line);margin:16px 0">${['spmb_badge','spmb_info','tahun_ajaran'].map(k=>fld([k,...CF[k]],C[k])).join('')}<div class="end"><button class="pri">💾 Simpan</button></div></form>`}
const jrow=(a,b)=>`<div class="row" style="margin-bottom:8px"><input name="ja" placeholder="Kegiatan, mis. Pendaftaran Online" value="${esc(a)}"><input name="jb" placeholder="Tanggal, mis. 1 - 15 Mei 2026" value="${esc(b)}"><button type="button" class="del" onclick="this.parentNode.remove()">🗑️</button></div>`;
async function saveJ(e){e.preventDefault();const f=e.target,a=[...f.querySelectorAll('[name=ja]')],b=[...f.querySelectorAll('[name=jb]')];
 const j=a.map((x,i)=>[x.value.trim().replace(/\|/g,'/'),b[i].value.trim().replace(/\|/g,'/')]).filter(r=>r[0]).map(r=>r.join('|')).join('\n');
 await putCfg({spmb_jadwal:j,spmb_badge:f.spmb_badge.value.trim(),spmb_info:f.spmb_info.value.trim(),tahun_ajaran:f.tahun_ajaran.value.trim()});jadwal()}

(async()=>{try{const{data:{session}}=await sb.auth.getSession();session?await enter(session.user):loginView()}catch(e){loginView();toast(e.message,1)}})();
</script>
</body>
</html>
